server:
  port: ${PORT:8080}

spring:
  application:
    name: rf-scheduler-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/rfscheduler;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: false
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:false}
    baseline-on-migrate: true
  data:
    redis:
      enabled: false
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

logging:
  level:
    com.rfscheduler.websocket: INFO
    com.rfscheduler.config.WebSocketConfig: INFO
    org.springframework.web.socket: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
  metrics:
    export:
      prometheus:
        enabled: true

rf:
  security:
    enabled: false
    jwt-secret: default-insecure-secret-key-change-in-production-long-enough-for-hmac256
  ml:
    scheduler:
      url: ${RF_ML_SCHEDULER_URL:http://localhost:8500}
      enabled: true # Set to true to call real ML service
      timeout-ms: 5000
    periodicity:
      url: ${RF_ML_PERIODICITY_URL:http://localhost:8600}
      enabled: true # Set to true to call real ML service
      timeout-ms: 5000
