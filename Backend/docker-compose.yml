version: '3.8'

services:
  db:
    image: postgres:15
    container_name: rfscheduler-db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: rfscheduler
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: rfscheduler-redis
    ports:
      - "6379:6379"

volumes:
  pgdata:
